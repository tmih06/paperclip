apiVersion: v1
kind: ResourceQuota
metadata:
  name: paperclip-quota
spec:
  hard:
    pods: "2"
    requests.cpu: "4"
    requests.memory: 8Gi
    limits.cpu: "4"
    limits.memory: 8Gi
---
apiVersion: v1
kind: LimitRange
metadata:
  name: paperclip-limits
spec:
  limits:
    - type: Pod
      max:
        cpu: "2"
        memory: 4Gi
    - type: Container
      max:
        cpu: "2"
        memory: 4Gi
      min:
        cpu: 100m
        memory: 128Mi
      default:
        cpu: "2"
        memory: 4Gi
      defaultRequest:
        cpu: 250m
        memory: 512Mi
