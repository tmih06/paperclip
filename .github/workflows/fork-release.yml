name: Fork Release
run-name: Dated GitHub Packages release (${{ inputs.release_date || 'today UTC' }})

on:
  workflow_dispatch:
    inputs:
      release_date:
        description: UTC date (YYYY-MM-DD); empty uses today. Version is YYYY.MDD.P.
        type: string
        default: ""
      rebuild_images:
        description: Rebuild and qualify images for a new patch version while reusing exact-source tests/native binaries
        type: boolean
        default: false
      qualification_run:
        description: Optional completed Fork Release run whose source, native, and image gates all passed
        type: string
        default: ""
      source_sha:
        description: Full source SHA (required only when resuming qualified outputs)
        type: string
        default: ""
      release_patch:
        description: Optional same-day patch slot (use a new slot after a partial immutable publish)
        type: string
        default: ""

permissions:
  contents: read
  actions: read

concurrency:
  group: fork-release
  cancel-in-progress: false

jobs:
  plan:
    if: github.repository == 'tmih06/paperclip'
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.version.outputs.version }}
      source: ${{ steps.source.outputs.sha }}
      artifact_run: ${{ inputs.qualification_run || github.run_id }}
      image_run: ${{ inputs.rebuild_images && github.run_id || inputs.qualification_run || github.run_id }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v6
        with:
          bun-version: 1.4.4
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: 24
      - id: source
        env:
          QUALIFICATION_RUN: ${{ inputs.qualification_run }}
          SOURCE_SHA: ${{ inputs.source_sha }}
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          if [ -n "$QUALIFICATION_RUN" ]; then
            bun scripts/fork-release-qualification.mjs "$QUALIFICATION_RUN" "$SOURCE_SHA" "$GITHUB_REPOSITORY"
            git cat-file -e "$SOURCE_SHA^{commit}"
          else
            test -z "$SOURCE_SHA"
            SOURCE_SHA=$(git rev-parse HEAD)
          fi
          echo "sha=$SOURCE_SHA" >> "$GITHUB_OUTPUT"
      - id: version
        env:
          RELEASE_DATE: ${{ inputs.release_date }}
          RELEASE_PATCH: ${{ inputs.release_patch }}
        run: bun scripts/fork-release.mjs version "$RELEASE_DATE" "$RELEASE_PATCH"
      - name: Test fork publication contract
        run: bun test scripts/__tests__/fork-release.test.mjs scripts/__tests__/run-vitest-stable-shard.test.mjs

  verify:
    if: inputs.qualification_run == ''
    needs: plan
    uses: ./.github/workflows/release-verify.yml
    with:
      ref: ${{ needs.plan.outputs.source }}

  native:
    if: inputs.qualification_run == ''
    needs: plan
    uses: ./.github/workflows/release-verify.yml
    with:
      ref: ${{ needs.plan.outputs.source }}
      runner_binaries_only: true

  packages:
    if: ${{ !cancelled() && needs.plan.result == 'success' && (needs.native.result == 'success' || inputs.qualification_run != '') }}
    needs: [plan, native]
    runs-on: ubuntu-latest
    timeout-minutes: 90
    env:
      PAPERCLIP_BUILD_COMMIT: ${{ needs.plan.outputs.source }}
      PAPERCLIP_BUILD_VERSION: ${{ needs.plan.outputs.version }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ${{ needs.plan.outputs.source }}
          persist-credentials: false
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v6
        with:
          bun-version: 1.4.4
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version: 24
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c
        with:
          pattern: runner-release-${{ needs.plan.outputs.artifact_run }}-*
          run-id: ${{ needs.plan.outputs.artifact_run }}
          github-token: ${{ github.token }}
          merge-multiple: true
          path: native-daemons
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c
        with:
          pattern: runner-provider-packs-${{ needs.plan.outputs.artifact_run }}-*
          run-id: ${{ needs.plan.outputs.artifact_run }}
          github-token: ${{ github.token }}
          merge-multiple: true
          path: native-packs
      - name: Load current fork packaging tooling for the qualified source
        env:
          TOOLING_SHA: ${{ github.sha }}
        run: |
          git fetch --depth=1 origin "$TOOLING_SHA"
          git show "$TOOLING_SHA:scripts/fork-release.mjs" > scripts/fork-release.mjs
      - name: Build complete public package payloads
        env:
          VERSION: ${{ needs.plan.outputs.version }}
          SOURCE: ${{ needs.plan.outputs.source }}
        run: |
          set -euo pipefail
          bun install --no-save
          bun run build
          bun packages/paperclip-runner/scripts/stage-release-runner-binaries.mjs assemble-daemons native-daemons "$SOURCE" native-packs
          cp -R packages/paperclip-runner/dist/bin/. server/dist/vendor/paperclip-runner/bin/
          cp -R packages/paperclip-runner/dist/remote-provider-packs server/dist/vendor/paperclip-runner/
          bun scripts/build-standalone-public-packages.mjs
          PAPERCLIP_RELEASE_REUSE_UI_DIST=1 bash scripts/prepare-server-ui-dist.sh
          for dir in server packages/adapters/claude-local packages/adapters/codex-local; do
            rm -rf "$dir/skills"
            cp -R skills "$dir/skills"
          done
          bun scripts/release-package-map.mjs set-version "$VERSION"
          bash scripts/build-npm.sh --skip-checks --skip-typecheck
          bun scripts/fork-release.mjs stage "$RUNNER_TEMP/packages" "$GITHUB_REPOSITORY_OWNER" "$VERSION" "$GITHUB_REPOSITORY"
          bun scripts/generate-feature-catalog.ts --version "$VERSION" --out "$RUNNER_TEMP/packages/feature-catalog.json"
          tar -czf "$RUNNER_TEMP/packages/runner-daemons.tar.gz" -C native-daemons .
          tar -czf "$RUNNER_TEMP/packages/provider-packs.tar.gz" -C native-packs .
          bun scripts/fork-release.mjs smoke-packed "$RUNNER_TEMP/packages"
          rm "$RUNNER_TEMP/packages/registry-packages.json"
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: fork-packages
          path: ${{ runner.temp }}/packages/
          if-no-files-found: error
          retention-days: 30

  images:
    if: inputs.qualification_run == '' || inputs.rebuild_images
    needs: plan
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: amd64
            runner: ubuntu-24.04
          - arch: arm64
            runner: ubuntu-24.04-arm
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 150
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ${{ needs.plan.outputs.source }}
          persist-credentials: false
      - name: Free build disk
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /usr/local/share/boost
          docker system prune -af
          df -h
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6
        with:
          bun-version: 1.4.4
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version: 24
      - name: Resolve private image lockfile
        run: bun install --no-save
      - uses: docker/setup-buildx-action@37fe631027851001ddb9b187196cc803df7f5f0e
      - uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4
        with:
          registry: ghcr.io
          username: ${{ github.repository_owner }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Build and smoke-test native candidate images
        env:
          SOURCE: ${{ needs.plan.outputs.source }}
          VERSION: ${{ needs.plan.outputs.version }}
          ARCH: ${{ matrix.arch }}
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/images"
          for target in runner-artifacts production cloud; do
            image="ghcr.io/$GITHUB_REPOSITORY:candidate-$SOURCE-$target-$ARCH"
            docker buildx build --target "$target" --platform "linux/$ARCH" --push \
              --build-arg "PAPERCLIP_BUILD_COMMIT=$SOURCE" \
              --build-arg "PAPERCLIP_RUNNER_SOURCE_REVISION=$SOURCE" \
              --build-arg "PAPERCLIP_BUILD_VERSION=$VERSION" \
              --build-arg "CLI_TOOLS_CACHE_EPOCH=$(date -u +%G-W%V)" \
              --cache-from "type=registry,ref=ghcr.io/$GITHUB_REPOSITORY:fork-buildcache-$ARCH" \
              --cache-to "type=registry,ref=ghcr.io/$GITHUB_REPOSITORY:fork-buildcache-$ARCH,mode=max,image-manifest=true,oci-mediatypes=true" \
              --metadata-file "$RUNNER_TEMP/images/$target-$ARCH.json" -t "$image" .
            if [ "$target" != runner-artifacts ]; then
              docker run -d --name fork-smoke --network host \
                -e PAPERCLIP_DEPLOYMENT_MODE=local_trusted -e PAPERCLIP_BIND=loopback \
                -e HOST=127.0.0.1 -e PORT=3200 "$image"
              ready=false
              for attempt in $(seq 1 180); do
                if [ "$(docker inspect -f '{{.State.Running}}' fork-smoke)" != true ]; then
                  docker logs fork-smoke
                  exit 1
                fi
                if bun --input-type=module -e 'const r=await fetch("http://127.0.0.1:3200/api/health");const h=await r.json();if(!r.ok||h.status!=="ok"||h.bootstrapStatus!=="ready")process.exit(1)' 2>/dev/null; then
                  ready=true
                  break
                fi
                sleep 2
              done
              docker logs fork-smoke
              if [ "$ready" != true ]; then exit 1; fi
              bun --input-type=module -e 'import assert from "node:assert/strict";const r=await fetch("http://127.0.0.1:3200/");assert.equal(r.status,200);assert.match(await r.text(),/<html/)'
              docker rm -fv fork-smoke
            fi
          done
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: fork-images-${{ matrix.arch }}
          path: ${{ runner.temp }}/images/
          if-no-files-found: error

  publish:
    if: ${{ !cancelled() && needs.plan.result == 'success' && needs.packages.result == 'success' && (needs.verify.result == 'success' || inputs.qualification_run != '') && (needs.images.result == 'success' || (inputs.qualification_run != '' && !inputs.rebuild_images)) }}
    needs: [plan, verify, packages, images]
    runs-on: ubuntu-latest
    timeout-minutes: 60
    permissions:
      contents: write
      packages: write
      actions: read
    env:
      NODE_AUTH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      VERSION: ${{ needs.plan.outputs.version }}
      SOURCE: ${{ needs.plan.outputs.source }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ${{ needs.plan.outputs.source }}
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version: 24
          registry-url: https://npm.pkg.github.com
          scope: '@tmih06'
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c
        with:
          name: fork-packages
          path: release-assets
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c
        with:
          pattern: fork-images-*
          run-id: ${{ needs.plan.outputs.image_run }}
          github-token: ${{ github.token }}
          merge-multiple: true
          path: release-assets/images
      - name: Load current fork publishing tooling
        env:
          TOOLING_SHA: ${{ github.sha }}
        run: |
          git fetch --depth=1 origin "$TOOLING_SHA"
          git show "$TOOLING_SHA:scripts/fork-release.mjs" > scripts/fork-release.mjs
      - name: Publish and verify every GitHub package
        run: |
          bun scripts/fork-release.mjs publish release-assets
          bun scripts/fork-release.mjs verify release-assets
          bun scripts/fork-release.mjs smoke release-assets
      - uses: docker/setup-buildx-action@37fe631027851001ddb9b187196cc803df7f5f0e
      - uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f
        with:
          registry: ghcr.io
          username: ${{ github.repository_owner }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Publish and verify multi-architecture image indexes
        run: |
          set -euo pipefail
          for target in runner-artifacts production cloud; do
            suffix="-$target"
            if [ "$target" = production ]; then suffix=""; fi
            refs=()
            for arch in amd64 arm64; do
              digest=$(jq -er '."containerimage.digest"' "release-assets/images/$target-$arch.json")
              refs+=("ghcr.io/$GITHUB_REPOSITORY@$digest")
            done
            image="ghcr.io/$GITHUB_REPOSITORY:$VERSION$suffix"
            docker buildx imagetools create -t "$image" "${refs[@]}"
            docker buildx imagetools inspect "$image" --raw > "release-assets/images/$target-index.json"
            jq -e '([.manifests[].platform | select(.os == "linux") | .architecture] | sort | unique) == ["amd64", "arm64"]' "release-assets/images/$target-index.json"
          done
          tar -czf release-assets/images.tar.gz -C release-assets images
          rm -rf release-assets/images
      - name: Attach and verify release artifacts before making release public
        run: |
          set -euo pipefail
          cd release-assets
          sha256sum ./*.tgz ./*.json ./*.tar.gz > SHA256SUMS
          cat > RELEASE-NOTES.md <<EOF
          # Paperclip fork v$VERSION

          Source: $SOURCE
          Fork: $GITHUB_REPOSITORY

          Packages are published to https://npm.pkg.github.com under @tmih06.
          The CLI is @tmih06/paperclipai@$VERSION. Configure @tmih06:registry=https://npm.pkg.github.com and authenticate with a read:packages token to install.

          Images (linux/amd64 and linux/arm64):
          - ghcr.io/$GITHUB_REPOSITORY:$VERSION
          - ghcr.io/$GITHUB_REPOSITORY:$VERSION-cloud
          - ghcr.io/$GITHUB_REPOSITORY:$VERSION-runner-artifacts

          Includes every CI-enabled public package, four native daemons, two Linux provider packs, feature catalog, registry verification, package startup smoke evidence, image manifests, and SHA256SUMS.
          Source typecheck, build, automated release tests, chaos/recovery tests, and native image startup probes must pass before publication.

          Build and verification: https://github.com/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID
          EOF
          if gh release view "v$VERSION" --repo "$GITHUB_REPOSITORY" --json isDraft,targetCommitish --jq 'select(.isDraft and .targetCommitish == env.SOURCE)' | grep -q .; then
            gh release edit "v$VERSION" --repo "$GITHUB_REPOSITORY" --notes-file RELEASE-NOTES.md
          else
            gh release create "v$VERSION" --repo "$GITHUB_REPOSITORY" --target "$SOURCE" --title "Paperclip fork v$VERSION" --notes-file RELEASE-NOTES.md --draft
          fi
          gh release upload "v$VERSION" --repo "$GITHUB_REPOSITORY" --clobber ./*.tgz ./*.json ./*.tar.gz SHA256SUMS
          mkdir -p "$RUNNER_TEMP/release-download"
          gh release download "v$VERSION" --repo "$GITHUB_REPOSITORY" --dir "$RUNNER_TEMP/release-download"
          (cd "$RUNNER_TEMP/release-download" && sha256sum -c SHA256SUMS)
          gh release edit "v$VERSION" --repo "$GITHUB_REPOSITORY" --draft=false --latest
          gh release view "v$VERSION" --repo "$GITHUB_REPOSITORY" --json url,tagName,isDraft,assets
