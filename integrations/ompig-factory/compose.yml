# Broker sidecar for the rootful host worker (systemd). Never mount its vault in clones.
# Create the dedicated, firewalled bridge with scripts/configure-network.mjs first.
# docker compose --env-file /etc/paperclip-factory-local/broker.env -f integrations/ompig-factory/compose.yml up -d
services:
  broker:
    image: "${OMPIG_BROKER_IMAGE:?Set an immutable ompig-slim-broker image digest}"
    restart: unless-stopped
    init: true
    user: "10001:10001"
    read_only: true
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
    pids_limit: 128
    mem_limit: 256m
    cpus: 0.5
    stop_grace_period: 45s
    # Listen ONLY on the local sandbox bridge gateway, never public interfaces.
    # Host networking avoids enabling inter-container communication just to reach the broker.
    network_mode: host
    environment:
      BROKER_BIND_IP: "${FACTORY_BROKER_BIND_IP:?Set the dedicated sandbox bridge gateway IPv4}"
      BROKER_PORT: "${FACTORY_BROKER_PORT:-8765}"
    entrypoint: [/bin/sh, -ec]
    command:
      - |
        export OMPIG_BROKER_TOKEN="$$(cat /run/secrets/broker_token)"
        exec ompig-slim-broker --bind="$$BROKER_BIND_IP:$$BROKER_PORT" --data-dir=/data
    secrets: [broker_token]
    volumes:
      - broker-data:/data
    tmpfs:
      - /tmp:rw,nosuid,nodev,noexec,size=16m,mode=1777
    healthcheck:
      test: [CMD-SHELL, 'curl --noproxy "*" -fsS "http://$$BROKER_BIND_IP:$$BROKER_PORT/healthz" >/dev/null']
      interval: 10s
      timeout: 5s
      start_period: 5s
      retries: 6
secrets:
  broker_token:
    # Compose bind-mounted file secrets retain HOST ownership: UID 10001, mode 0400.
    file: "${OMPIG_BROKER_TOKEN_FILE:?Set the absolute broker bearer file path}"
volumes:
  broker-data:
